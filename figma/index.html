<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>4Ta · 主页 · Figma Import</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #eee;
      font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
    }
    body { display: flex; justify-content: center; }
    .frame {
      position: relative;
      width: 390px;
      height: 844px;
      overflow: hidden;
      background: #fff;
      color: #111;
    }
    .topbar {
      position: absolute;
      top: 22px;
      right: 20px;
      left: 20px;
      height: 61px;
    }
    .profile {
      position: absolute;
      top: 0;
      left: 0;
      width: 42px;
      text-align: center;
    }
    .profile-box {
      display: flex;
      width: 38px;
      height: 38px;
      border: 1px solid #dedede;
      border-radius: 8px;
      align-items: center;
      justify-content: center;
    }
    .profile-box svg { width: 23px; height: 23px; }
    .status {
      display: flex;
      width: 42px;
      margin-top: 5px;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      white-space: nowrap;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #111;
    }
    h1 {
      position: absolute;
      top: 10px;
      left: 50%;
      margin: 0;
      font-size: 19px;
      font-weight: 600;
      letter-spacing: .12em;
      line-height: 1;
      transform: translateX(-50%);
    }
    .plus {
      position: absolute;
      top: 3px;
      right: 0;
      width: 30px;
      height: 30px;
    }
    .plus::before, .plus::after {
      position: absolute;
      top: 14px;
      left: 2px;
      width: 26px;
      height: 1.5px;
      background: #111;
      content: "";
    }
    .plus::after { transform: rotate(90deg); }
    .chat-list {
      position: absolute;
      top: 100px;
      right: 20px;
      left: 20px;
    }
    .chat {
      position: relative;
      display: flex;
      height: 78px;
      align-items: center;
      border-bottom: 1px solid #e7e7e7;
    }
    .chat:last-child { border-bottom: 0; }
    .avatar {
      position: relative;
      width: 49px;
      height: 49px;
      flex: 0 0 49px;
      overflow: hidden;
      border-radius: 9px;
      background: #e4e1dc;
    }
    .avatar svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .copy {
      min-width: 0;
      margin-left: 18px;
      padding-right: 55px;
    }
    .name {
      margin-bottom: 6px;
      font-size: 16px;
      font-weight: 600;
      line-height: 1;
    }
    .preview {
      overflow: hidden;
      color: #767676;
      font-size: 13px;
      line-height: 1.25;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .time {
      position: absolute;
      top: 25px;
      right: 4px;
      color: #777;
      font-size: 11px;
    }
    .unread {
      position: absolute;
      right: 8px;
      bottom: 19px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #5b5142;
    }
    .bottom-nav {
      position: absolute;
      right: 0;
      bottom: 0;
      left: 0;
      height: 108px;
      background: #fff;
      box-shadow: 0 -4px 18px rgba(0,0,0,.025);
    }
    .heartbeat {
      position: absolute;
      top: -10px;
      left: 0;
      width: 390px;
      height: 21px;
    }
    .heartbeat path {
      fill: none;
      stroke: #111;
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
    }
    .nav-grid {
      position: absolute;
      top: 10px;
      right: 11px;
      bottom: 0;
      left: 11px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
    }
    .nav-item {
      position: relative;
      display: flex;
      padding-top: 21px;
      flex-direction: column;
      align-items: center;
      color: #111;
      font-size: 11px;
    }
    .nav-icon {
      width: 22px;
      height: 22px;
      margin-bottom: 8px;
    }
    .heart-item { padding-top: 54px; }
    .heart-circle {
      position: absolute;
      top: -39px;
      left: 50%;
      display: flex;
      width: 66px;
      height: 66px;
      border: 1px solid #ededed;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 5px 16px rgba(0,0,0,.08);
      align-items: center;
      justify-content: center;
      transform: translateX(-50%);
    }
    .heart-circle svg { width: 32px; height: 32px; }
  </style>
</head>
<body>
  <main class="frame">
    <header class="topbar">
      <div class="profile">
        <div class="profile-box">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="7.4" r="3.1" fill="none" stroke="#111" stroke-width="1.5"/>
            <path d="M5.5 20c.5-4.2 2.7-6.3 6.5-6.3s6 2.1 6.5 6.3" fill="none" stroke="#111" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="status"><i class="status-dot"></i><span>在线</span></div>
      </div>
      <h1>消息</h1>
      <div class="plus" aria-label="添加"></div>
    </header>

    <section class="chat-list">
      <article class="chat">
        <div class="avatar">
          <svg viewBox="0 0 49 49">
            <path d="M34 11c-3-5-13-4-17 1-3 4-2 8-1 12-2 1-3 3-2 5 1 2 3 2 4 2 1 5-1 8-5 12h27c-5-5-7-9-7-14 2-6 3-13 1-18Z" fill="#aaa49d" opacity=".55"/>
            <path d="M17 18c5-2 9-6 11-10 1 4 3 7 6 10" fill="none" stroke="#918a82" stroke-width="1" opacity=".4"/>
          </svg>
        </div>
        <div class="copy"><div class="name">林屿</div><div class="preview">今天过得怎么样？</div></div>
        <time class="time">刚刚</time><i class="unread"></i>
      </article>
      <article class="chat">
        <div class="avatar">
          <svg viewBox="0 0 49 49"><path d="M34 11c-3-5-13-4-17 1-3 4-2 8-1 12-2 1-3 3-2 5 1 2 3 2 4 2 1 5-1 8-5 12h27c-5-5-7-9-7-14 2-6 3-13 1-18Z" fill="#aaa49d" opacity=".55"/></svg>
        </div>
        <div class="copy"><div class="name">顾言</div><div class="preview">别忘了吃晚饭。</div></div>
        <time class="time">18:42</time>
      </article>
      <article class="chat">
        <div class="avatar">
          <svg viewBox="0 0 49 49"><path d="M34 11c-3-5-13-4-17 1-3 4-2 8-1 12-2 1-3 3-2 5 1 2 3 2 4 2 1 5-1 8-5 12h27c-5-5-7-9-7-14 2-6 3-13 1-18Z" fill="#aaa49d" opacity=".55"/></svg>
        </div>
        <div class="copy"><div class="name">阿澈</div><div class="preview">到家记得告诉我。</div></div>
        <time class="time">16:08</time>
      </article>
      <article class="chat">
        <div class="avatar">
          <svg viewBox="0 0 49 49"><path d="M34 11c-3-5-13-4-17 1-3 4-2 8-1 12-2 1-3 3-2 5 1 2 3 2 4 2 1 5-1 8-5 12h27c-5-5-7-9-7-14 2-6 3-13 1-18Z" fill="#aaa49d" opacity=".55"/></svg>
        </div>
        <div class="copy"><div class="name">周屿</div><div class="preview">晚安，明天见。</div></div>
        <time class="time">昨天</time>
      </article>
    </section>

    <nav class="bottom-nav">
      <svg class="heartbeat" viewBox="0 0 390 21" preserveAspectRatio="none">
        <path d="M0 11h145l5-10 7 19 7-14 7 5h48l5-10 7 19 7-14 7 5h145"/>
      </svg>
      <div class="nav-grid">
        <div class="nav-item">
          <svg class="nav-icon" viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2" fill="none" stroke="#111" stroke-width="1.5"/><path d="M10 6h4M11 18h2" fill="none" stroke="#111" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span>手机</span>
        </div>
        <div class="nav-item">
          <svg class="nav-icon" viewBox="0 0 24 24"><rect x="5" y="6.5" width="14" height="13" rx="1" fill="none" stroke="#111" stroke-width="1.5"/><path d="M8 4v5M16 4v5M5 10h14" fill="none" stroke="#111" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span>日常</span>
        </div>
        <div class="nav-item heart-item">
          <div class="heart-circle"><svg viewBox="0 0 24 24"><path d="M20.4 5.7c-2-2-5.1-1.8-6.9.1L12 7.4l-1.5-1.6a4.8 4.8 0 0 0-6.9-.1c-2.1 2.2-1.9 5.7.2 7.8L12 21l8.2-7.5c2.1-2.1 2.3-5.6.2-7.8Z" fill="none" stroke="#111" stroke-width="1.5" stroke-linejoin="round"/></svg></div>
          <span>信息</span>
        </div>
        <div class="nav-item">
          <svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5.2" fill="none" stroke="#111" stroke-width="1.5"/><path d="M3.3 14.2c1.1 2 5.8 1.5 10.4-1s7.4-5.2 6.3-7.1-5.8-1.5-10.4 1-7.4 5.2-6.3 7.1Z" fill="none" stroke="#111" stroke-width="1.5"/></svg>
          <span>时空</span>
        </div>
        <div class="nav-item">
          <svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="7.5" r="3.2" fill="none" stroke="#111" stroke-width="1.5"/><path d="M5.5 20c.5-4.2 2.7-6.3 6.5-6.3s6 2.1 6.5 6.3" fill="none" stroke="#111" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span>我的</span>
        </div>
      </div>
    </nav>
  </main>
</body>
</html>
