<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>4Ta · 消息主页预览</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-width: 320px; min-height: 100%; margin: 0; }
    body {
      background: #f4f3f1;
      color: #171615;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }
    button { border: 0; background: transparent; color: inherit; font: inherit; cursor: pointer; }
    svg { display: block; width: 100%; height: 100%; }
    .screen {
      position: relative;
      width: min(100%, 430px);
      min-height: 100dvh;
      margin: 0 auto;
      overflow: hidden;
      background: #fff;
      box-shadow: 0 0 40px rgb(0 0 0 / 5%);
    }
    .screen[hidden] { display: none; }
    .welcome {
      display: flex;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      flex-direction: column;
      justify-content: space-between;
    }
    .welcome-head, .form-head { display: flex; align-items: center; justify-content: space-between; }
    .brand { font-size: 17px; font-weight: 600; }
    .quiet { padding: 12px 0; color: #7a756f; font-size: 13px; }
    .welcome-copy {
      display: grid;
      min-height: 180px;
      padding: 50px 0;
      place-items: center;
      text-align: center;
    }
    .welcome-line {
      max-width: 350px;
      margin: 0;
      font-size: 19px;
      line-height: 1.75;
      animation: fadeUp .7s both;
    }
    .script-ta { font-family: "Segoe Script", cursive; font-size: 1.35em; font-weight: 600; }
    .welcome-foot { display: grid; gap: 13px; }
    .dots { display: flex; gap: 6px; height: 6px; }
    .dots i { width: 6px; border-radius: 99px; background: #e6e3de; transition: .25s; }
    .dots i.active { width: 20px; background: #171615; }
    .primary {
      width: 100%;
      min-height: 56px;
      border-radius: 18px;
      background: #171615;
      color: white;
      font-weight: 600;
    }
    .form-screen { height: 100dvh; padding: max(24px, env(safe-area-inset-top)) 24px 30px; overflow-y: auto; }
    .form-head { display: grid; grid-template-columns: 44px 1fr 44px; text-align: center; }
    .back { padding: 5px 0; font-size: 29px; text-align: left; }
    .step { color: #7a756f; font-size: 12px; }
    .demo-form { display: grid; gap: 25px; padding-top: 26px; }
    .demo-form h1 { margin: 0; font-size: 27px; font-weight: 500; }
    .avatar-pick { display: flex; align-items: center; gap: 16px; }
    .avatar-pick > i {
      display: grid;
      width: 64px;
      height: 64px;
      border: 1px solid #e6e3de;
      border-radius: 50%;
      background: white;
      color: #7a756f;
      place-items: center;
      font-size: 22px;
      font-style: normal;
    }
    .avatar-pick strong, .avatar-pick small { display: block; }
    .avatar-pick strong { margin-bottom: 5px; font-size: 14px; }
    .avatar-pick small { color: #7a756f; font-size: 11px; }
    .fields { display: grid; gap: 18px; }
    .fields h2 { margin: 0; font-size: 15px; }
    .field { display: grid; gap: 8px; font-size: 13px; font-weight: 600; }
    .field em { margin-left: 5px; color: #7a756f; font-size: 10px; font-style: normal; }
    .field input, .field textarea {
      width: 100%;
      padding: 14px 15px;
      border: 1px solid #e6e3de;
      border-radius: 14px;
      outline: none;
      background: white;
      font: inherit;
      font-weight: 400;
      line-height: 1.6;
      resize: vertical;
    }
    .field input:focus, .field textarea:focus { border-color: #171615; }
    .error { color: #a34539; font-size: 11px; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .header {
      display: grid;
      height: 104px;
      padding: max(22px, env(safe-area-inset-top)) 20px 0;
      grid-template-columns: 48px 1fr 48px;
      align-items: center;
    }
    .header h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: .08em;
      text-align: center;
    }
    .profile {
      display: grid;
      padding: 0;
      justify-items: center;
      gap: 3px;
    }
    .self-avatar {
      display: grid;
      width: 39px;
      height: 39px;
      padding: 8px;
      border: 1px solid #dedbd7;
      border-radius: 9px;
      background: white;
      color: #171615;
      place-items: center;
    }
    .online { display: flex; align-items: center; gap: 4px; color: #171615; font-size: 11px; }
    .online::before {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #171615;
      content: "";
    }
    .add { width: 44px; height: 44px; padding: 10px; }
    .list { padding: 4px 20px 120px; }
    .chat {
      display: grid;
      width: 100%;
      min-height: 78px;
      padding: 13px 0;
      grid-template-columns: 49px 1fr auto;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid #f1f0ee;
      text-align: left;
    }
    .avatar {
      display: grid;
      width: 49px;
      height: 49px;
      overflow: hidden;
      border-radius: 10px;
      color: rgb(255 255 255 / 94%);
      place-items: center;
    }
    .avatar svg {
      width: 100%;
      height: 100%;
    }
    .copy { display: grid; min-width: 0; gap: 4px; }
    .copy strong { overflow: hidden; font-size: 16px; text-overflow: ellipsis; white-space: nowrap; }
    .copy small { overflow: hidden; color: #77736f; font-size: 13px; text-overflow: ellipsis; white-space: nowrap; }
    .meta {
      display: grid;
      align-self: stretch;
      min-width: 38px;
      align-content: center;
      justify-items: end;
      gap: 8px;
      color: #aaa6a1;
      font-size: 9px;
    }
    .unread { width: 6px; height: 6px; border-radius: 50%; background: #191817; }
    .bottom {
      position: fixed;
      z-index: 3;
      right: max(0px, calc((100vw - 430px) / 2));
      bottom: 0;
      left: max(0px, calc((100vw - 430px) / 2));
      height: calc(80px + env(safe-area-inset-bottom));
      background: rgb(255 255 255 / 97%);
      box-shadow: 0 -6px 24px rgb(0 0 0 / 4%);
      backdrop-filter: blur(14px);
    }
    .pulse {
      position: absolute;
      top: -5px;
      width: 100%;
      height: 18px;
      overflow: visible;
    }
    .pulse path { fill: none; stroke: #d7d4d0; stroke-width: 1; vector-effect: non-scaling-stroke; }
    .nav {
      display: grid;
      height: 100%;
      padding: 0 8px env(safe-area-inset-bottom);
      grid-template-columns: repeat(5, 1fr);
    }
    .nav button {
      position: relative;
      display: grid;
      padding: 16px 0 6px;
      align-content: center;
      justify-items: center;
      gap: 4px;
      color: #98938d;
      font-size: 10px;
    }
    .nav button.active { color: #171615; }
    .icon { width: 22px; height: 22px; }
    .heart-button { padding: 0 !important; }
    .heart-button .icon {
      position: absolute;
      top: -23px;
      display: grid;
      width: 70px;
      height: 70px;
      padding: 19px;
      border: 1px solid #e2dfdb;
      border-radius: 50%;
      background: white;
      color: #171615;
      box-shadow: 0 7px 22px rgb(0 0 0 / 8%);
      place-items: center;
    }
    .heart-button > span:last-child { position: absolute; top: 57px; }
    .toast {
      position: fixed;
      z-index: 8;
      right: 50%;
      bottom: 104px;
      display: none;
      margin: 0;
      padding: 9px 14px;
      border-radius: 999px;
      background: rgb(25 24 23 / 88%);
      color: white;
      font-size: 11px;
      transform: translateX(50%);
    }
  </style>
</head>
<body>
  <main class="screen welcome" id="welcome">
    <header class="welcome-head">
      <span class="brand">4Ta</span>
      <button class="quiet" id="skipWelcome">跳过</button>
    </header>
    <section class="welcome-copy">
      <p class="welcome-line" id="welcomeLine">有些相遇，或许只差一个属于你们的时空。</p>
    </section>
    <footer class="welcome-foot">
      <div class="dots" id="welcomeDots"><i class="active"></i><i></i><i></i><i></i></div>
      <button class="primary" id="startButton" hidden>创建 Ta</button>
    </footer>
  </main>

  <main class="screen form-screen" id="createTa" hidden>
    <header class="form-head">
      <button class="back" type="button" data-go="welcome">‹</button>
      <span class="step">1 / 2</span>
      <button class="quiet" type="button" data-go="welcome">退出</button>
    </header>
    <form class="demo-form" id="taForm">
      <h1>关于 <span class="script-ta">Ta</span></h1>
      <label class="avatar-pick"><i>＋</i><span><strong>添加 Ta 的头像</strong><small>可选 · JPG、PNG 或 WebP</small></span><input type="file" accept="image/*" hidden></label>
      <section class="fields">
        <label class="field">Ta 的名字 <em>必填</em><input name="taName" placeholder="例如：林屿"></label>
        <label class="field">Ta 是怎样的人 <em>必填</em><textarea name="taSetting" rows="4" placeholder="性格、身份，以及 Ta 说话和表达的方式……"></textarea></label>
      </section>
      <section class="fields">
        <h2>你们的关系</h2>
        <label class="field">关系描述 <em>必填</em><textarea name="relationship" rows="3" placeholder="你们如何认识，现在处于怎样的关系……"></textarea></label>
      </section>
      <p class="error" hidden>请先填写所有必填内容</p>
      <button class="primary" type="submit">下一步</button>
    </form>
  </main>

  <main class="screen form-screen" id="createYou" hidden>
    <header class="form-head">
      <button class="back" type="button" data-go="createTa">‹</button>
      <span class="step">2 / 2</span>
      <button class="quiet" type="button" data-go="welcome">退出</button>
    </header>
    <form class="demo-form" id="youForm">
      <h1>关于 <span class="script-ta">You</span></h1>
      <label class="avatar-pick"><i>＋</i><span><strong>添加你的头像</strong><small>必填 · JPG、PNG 或 WebP</small></span><input name="youAvatar" type="file" accept="image/*" hidden></label>
      <section class="fields">
        <label class="field">姓名或昵称 <em>必填</em><input name="youName" placeholder="例如：小禾"></label>
        <label class="field">性别 <em>必填</em><input name="gender" placeholder="按你认同的方式填写"></label>
        <label class="field">希望 Ta 如何称呼你 <em>必填</em><input name="address" placeholder="昵称，或一个特别的称呼"></label>
      </section>
      <section class="fields">
        <h2>个人背景</h2>
        <label class="field"><textarea name="background" rows="5" placeholder="你的喜好；&#10;不喜欢的事物；&#10;当前生活状态；"></textarea></label>
      </section>
      <p class="error" hidden>请先填写所有必填内容</p>
      <button class="primary" type="submit">完成</button>
    </form>
  </main>

  <main class="screen home-screen" id="home" hidden>
    <header class="header">
      <button class="profile" data-message="当前状态：在线">
        <span class="self-avatar"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M5.5 20c.6-4 2.7-6 6.5-6s5.9 2 6.5 6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></span>
        <span class="online">在线</span>
      </button>
      <h1>消息</h1>
      <button class="add" aria-label="新建聊天" data-message="新建聊天功能将在下一步实现">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      </button>
    </header>

    <section class="list">
      <button class="chat" data-message="打开与林屿的聊天">
        <span class="avatar" style="background:#e1ddd7"><svg viewBox="0 0 48 48"><path d="M31 10c-3-4-12-3-15 2-2 3-2 7-1 10-2 1-3 3-2 5 1 2 2 2 4 2 1 5-1 7-4 10h24c-4-4-6-7-6-12 2-5 2-12 0-17Z" fill="rgba(76,70,64,.3)"/></svg></span>
        <span class="copy"><strong>林屿</strong><small>今天过得怎么样？</small></span>
        <span class="meta"><time>刚刚</time><i class="unread"></i></span>
      </button>
      <button class="chat" data-message="打开与顾言的聊天">
        <span class="avatar" style="background:#e1ddd7"><svg viewBox="0 0 48 48"><path d="M31 10c-3-4-12-3-15 2-2 3-2 7-1 10-2 1-3 3-2 5 1 2 2 2 4 2 1 5-1 7-4 10h24c-4-4-6-7-6-12 2-5 2-12 0-17Z" fill="rgba(76,70,64,.3)"/></svg></span>
        <span class="copy"><strong>顾言</strong><small>别忘了吃晚饭。</small></span>
        <span class="meta"><time>18:42</time></span>
      </button>
      <button class="chat" data-message="打开与阿澈的聊天">
        <span class="avatar" style="background:#e1ddd7"><svg viewBox="0 0 48 48"><path d="M31 10c-3-4-12-3-15 2-2 3-2 7-1 10-2 1-3 3-2 5 1 2 2 2 4 2 1 5-1 7-4 10h24c-4-4-6-7-6-12 2-5 2-12 0-17Z" fill="rgba(76,70,64,.3)"/></svg></span>
        <span class="copy"><strong>阿澈</strong><small>到家记得告诉我。</small></span>
        <span class="meta"><time>16:08</time></span>
      </button>
      <button class="chat" data-message="打开与周屿的聊天">
        <span class="avatar" style="background:#e1ddd7"><svg viewBox="0 0 48 48"><path d="M31 10c-3-4-12-3-15 2-2 3-2 7-1 10-2 1-3 3-2 5 1 2 2 2 4 2 1 5-1 7-4 10h24c-4-4-6-7-6-12 2-5 2-12 0-17Z" fill="rgba(76,70,64,.3)"/></svg></span>
        <span class="copy"><strong>周屿</strong><small>晚安，明天见。</small></span>
        <span class="meta"><time>昨天</time></span>
      </button>
    </section>

    <p class="toast" role="status"></p>

    <nav class="bottom">
      <svg class="pulse" viewBox="0 0 390 18" preserveAspectRatio="none"><path d="M0 10h145l5-12 7 23 7-15 7 4h48l5-12 7 23 7-15 7 4h145"/></svg>
      <div class="nav">
        <button data-message="手机页面将在下一步实现">
          <span class="icon"><svg viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M10 6h4M11 18h2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></span><span>手机</span>
        </button>
        <button data-message="日常页面将在下一步实现">
          <span class="icon"><svg viewBox="0 0 24 24"><path d="M5 8.5h14v11H5zM8 4.5v4M16 4.5v4M5 11h14m-10 4 1.5 1.5L14 13" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>日常</span>
        </button>
        <button class="heart-button active" aria-label="消息" data-message="消息">
          <span class="icon"><svg viewBox="0 0 24 24"><path d="M20.4 5.7c-2-2-5.1-1.8-6.9.1L12 7.4l-1.5-1.6a4.8 4.8 0 0 0-6.9-.1c-2.1 2.2-1.9 5.7.2 7.8L12 21l8.2-7.5c2.1-2.1 2.3-5.6.2-7.8Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></span>
          <span>信息</span>
        </button>
        <button data-message="时空页面将在下一步实现">
          <span class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M3.2 14.3c1.1 2 5.8 1.5 10.5-1s7.5-5.2 6.4-7.2-5.8-1.5-10.5 1-7.5 5.2-6.4 7.2Z" fill="none" stroke="currentColor" stroke-width="1.7"/></svg></span><span>时空</span>
        </button>
        <button data-message="我的页面将在下一步实现">
          <span class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M5.5 20c.6-4 2.7-6 6.5-6s5.9 2 6.5 6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></span><span>我的</span>
        </button>
      </div>
    </nav>
  </main>
  <script>
    const toast = document.querySelector(".toast");
    let timer;
    const screens = [...document.querySelectorAll(".screen")];
    function showScreen(id) {
      screens.forEach((screen) => screen.hidden = screen.id !== id);
      window.scrollTo(0, 0);
    }

    const lines = [
      "有些相遇，或许只差一个属于你们的时空。",
      "或许你们在另一个时空",
      "Ta会记住你，陪伴你，也与你共同成长。",
      '创造只属于你的 <span class="script-ta">Ta</span>'
    ];
    let lineIndex = 0;
    const welcomeLine = document.querySelector("#welcomeLine");
    const dots = [...document.querySelectorAll("#welcomeDots i")];
    const startButton = document.querySelector("#startButton");
    let welcomeTimer;
    function renderWelcomeLine() {
      welcomeLine.style.animation = "none";
      void welcomeLine.offsetWidth;
      welcomeLine.innerHTML = lines[lineIndex];
      welcomeLine.style.animation = "fadeUp .7s both";
      dots.forEach((dot, index) => dot.classList.toggle("active", index === lineIndex));
      clearTimeout(welcomeTimer);
      welcomeTimer = setTimeout(() => {
        if (lineIndex < lines.length - 1) {
          lineIndex += 1;
          renderWelcomeLine();
        } else {
          finishWelcome();
        }
      }, 2200);
    }
    function finishWelcome() {
      clearTimeout(welcomeTimer);
      welcomeLine.textContent = "现在，去见 Ta。";
      document.querySelector("#welcomeDots").hidden = true;
      startButton.hidden = false;
    }
    document.querySelector("#skipWelcome").addEventListener("click", finishWelcome);
    startButton.addEventListener("click", () => showScreen("createTa"));
    document.querySelectorAll("[data-go]").forEach((button) => {
      button.addEventListener("click", () => showScreen(button.dataset.go));
    });
    document.querySelector("#taForm").addEventListener("submit", (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      const missing = !form.taName.value.trim() || !form.taSetting.value.trim() || !form.relationship.value.trim();
      form.querySelector(".error").hidden = !missing;
      if (!missing) showScreen("createYou");
    });
    document.querySelector("#youForm").addEventListener("submit", (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      const missing = !form.youAvatar.files.length || !form.youName.value.trim() || !form.gender.value.trim() || !form.address.value.trim();
      form.querySelector(".error").hidden = !missing;
      if (!missing) showScreen("home");
    });
    document.querySelectorAll("[data-message]").forEach((button) => {
      button.addEventListener("click", () => {
        if (button.closest(".nav")) {
          document.querySelectorAll(".nav button").forEach((item) => item.classList.remove("active"));
          button.classList.add("active");
        }
        toast.textContent = button.dataset.message;
        toast.style.display = "block";
        clearTimeout(timer);
        timer = setTimeout(() => toast.style.display = "none", 1500);
      });
    });
    renderWelcomeLine();
  </script>
</body>
</html>
